<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow"><title>SAP Easy Access — Anheuser-Busch</title>
  <link rel="stylesheet" href="styles.css"><script type="module" src="app.js"></script>
</head>
<body>
  <div class="sap-window">
    <header class="window-title"><span class="sap-mark">SAP</span><span>Anheuser-Busch · Sales and Distribution</span><span class="window-system">AB1 (1) 100</span></header>
    <nav class="menu-bar" aria-label="SAP menu"><button data-menu="document">Sales document</button><button data-menu="edit">Edit</button><button data-menu="goto">Goto</button><button data-menu="system">System</button><button data-menu="help">Help</button></nav>
    <div class="standard-toolbar"><button class="icon-button enter" id="execute" title="Enter transaction" aria-label="Enter transaction">✓</button><input id="command" aria-label="Transaction code" title="Transaction code" value="/nVA01" spellcheck="false"><span class="tool-separator"></span><button class="icon-button" id="new" title="New document" aria-label="New document">▤</button><button class="icon-button save-icon" id="save" title="Save (Ctrl+S)" aria-label="Save document">▣</button><span class="tool-separator"></span><button class="icon-button back-icon" id="back" title="Back" aria-label="Back">◀</button><button class="icon-button cancel-icon" id="cancel" title="Cancel entry" aria-label="Cancel entry">✕</button><span class="tool-separator"></span><button class="icon-button" id="find" title="Display document" aria-label="Display document">⌕</button><button class="icon-button" id="help" title="Application help" aria-label="Application help">?</button><span class="toolbar-end">DEMONSTRATION SYSTEM</span></div>
    <div class="transaction-title"><span class="document-icon">▤</span><h1 id="screen-title">Create Credit Memo Request: Overview</h1></div>
    <div class="application-toolbar"><button id="create-reference"><span class="toolbar-symbol" aria-hidden="true">▥</span> Create with Reference</button><button id="check"><span class="check-symbol" aria-hidden="true">✓</span> Check</button><button id="display"><span class="toolbar-symbol" aria-hidden="true">⌕</span> Display Document</button><span id="document-number"></span><button class="save-text" id="save-text">Save</button></div>
    <main id="main"></main>
    <div class="workspace-filler"></div>
    <footer class="status-bar"><div id="status" role="status" aria-live="polite"><span class="status-icon info">i</span><span>Create a sales document with reference to a billing document.</span></div><div class="status-system"><span id="transaction-name">VA01</span><span>AB1</span><span>100</span><span>EN</span><span>OVR</span><span class="connection-dot"></span></div></footer>
  </div>
  <div id="menu" role="menu" hidden></div><dialog id="dialog"></dialog>
</body>
</html>
