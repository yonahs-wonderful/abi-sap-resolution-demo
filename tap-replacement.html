<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow"><title>Tap Replacement — Anheuser-Busch</title>
  <link rel="stylesheet" href="styles.css"><script type="module" src="tap-replacement.js"></script>
  <style>.tap-replacement .group{margin-bottom:12px;padding-top:12px;padding-bottom:10px}.tap-replacement .group-grid{gap:8px 35px}.tap-replacement .field input,.tap-replacement .field select{flex:1;width:100%}.tap-replacement .field{min-width:0}.tap-replacement .text-editor{margin-top:12px}.tap-replacement textarea{height:58px}.tap-replacement .tab-panel{min-height:0}</style>
</head>
<body class="tap-replacement">
  <div class="sap-window">
    <header class="window-title"><span class="sap-mark">SAP</span><span>Anheuser-Busch · Equipment Services</span><span class="window-system">AB1 (1) 100</span></header>
    <nav class="menu-bar" aria-label="SAP menu"><button data-menu="document">Equipment request</button><button data-menu="edit">Edit</button><button data-menu="goto">Goto</button><button data-menu="system">System</button><button data-menu="help">Help</button></nav>
    <div class="standard-toolbar"><button class="icon-button enter" id="execute" title="Enter transaction" aria-label="Enter transaction">✓</button><input id="command" aria-label="Transaction code" title="Transaction code" value="/nZTAP01" spellcheck="false"><span class="tool-separator"></span><button class="icon-button" id="new" title="New request" aria-label="New request">▤</button><button class="icon-button save-icon" id="save" title="Save (Ctrl+S)" aria-label="Save replacement request">▣</button><span class="tool-separator"></span><button class="icon-button back-icon" id="back" title="Back" aria-label="Back">◀</button><button class="icon-button cancel-icon" id="cancel" title="Cancel entry" aria-label="Cancel entry">✕</button><span class="tool-separator"></span><button class="icon-button" id="find" title="Display request" aria-label="Display request">⌕</button><button class="icon-button" id="help" title="Application help" aria-label="Application help">?</button><span class="toolbar-end">DEMONSTRATION SYSTEM</span></div>
    <div class="transaction-title"><span class="document-icon">▤</span><h1 id="screen-title">Create Tap Replacement Request</h1></div>
    <div class="application-toolbar"><button id="load-customer"><span class="toolbar-symbol" aria-hidden="true">▥</span> New Request</button><button id="check"><span class="check-symbol" aria-hidden="true">✓</span> Check</button><button id="display"><span class="toolbar-symbol" aria-hidden="true">⌕</span> Display Request</button><span id="document-number"></span><button class="save-text" id="save-text">Save</button></div>
    <main id="main"></main>
    <div class="workspace-filler"></div>
    <footer class="status-bar"><div id="status" role="status" aria-live="polite"><span class="status-icon info">i</span><span>Enter the approved equipment replacement and reference.</span></div><div class="status-system"><span id="transaction-name">ZTAP01</span><span>AB1</span><span>100</span><span>EN</span><span>OVR</span><span class="connection-dot"></span></div></footer>
  </div>
  <div id="menu" role="menu" hidden></div><dialog id="dialog"></dialog>
</body>
</html>
